@if (cv$ | async; as cv) {
  <section id="galeria" class="content-section scroll-mt">
    <h2 class="section-title">Galería personal</h2>
    <p class="text-muted">Haz clic en una imagen para ampliarla. Sustituye los SVG en <code>src/assets/images/</code>.</p>

    <div class="row row-cols-1 row-cols-sm-2 g-4">
      @for (foto of cv.galeria; track foto.id) {
        <div class="col">
          <button type="button" class="gallery-card w-100 border-0 p-0 text-start" (click)="open(foto)">
            <img [src]="foto.url" [alt]="foto.titulo" class="gallery-img w-100" loading="lazy" />
            <div class="p-3">
              <h3 class="h6 mb-1">{{ foto.titulo }}</h3>
              <p class="small text-muted mb-0">{{ foto.descripcion }}</p>
            </div>
          </button>
        </div>
      }
    </div>
  </section>

  @if (selected(); as foto) {
    <div class="modal fade show d-block gallery-modal" tabindex="-1" role="dialog" (click)="close()" (keydown.escape)="close()">
      <div class="modal-dialog modal-dialog-centered modal-lg" role="document" (click)="$event.stopPropagation()">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">{{ foto.titulo }}</h5>
            <button type="button" class="btn-close" aria-label="Cerrar" (click)="close()"></button>
          </div>
          <div class="modal-body p-0">
            <img [src]="foto.url" [alt]="foto.titulo" class="w-100" />
          </div>
          <div class="modal-footer">
            <p class="mb-0 text-muted">{{ foto.descripcion }}</p>
          </div>
        </div>
      </div>
    </div>
    <div class="modal-backdrop fade show"></div>
  }
}
